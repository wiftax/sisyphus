name: ci

# Typecheck and tests. No secrets, no write access, nothing leaves the runner.
# The patrol itself runs from wiftax/wiftax (.github/workflows/patrol.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
